<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#640c0e" />
    <title>Offline — SFU MSA Projects</title>
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <style>
      :root {
        color-scheme: light;
        --primary: #640c0e;
        --cream: #fffbf4;
        --ivory: #ebe8de;
        --charcoal: #1e1e1e;
        --muted: #6b7280;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background: var(--cream);
        color: var(--charcoal);
      }
      .card {
        width: 100%;
        max-width: 26rem;
        background: #fff;
        border: 1px solid var(--ivory);
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
        text-align: center;
        box-shadow: 0 12px 32px -4px rgba(30, 30, 30, 0.07);
      }
      img {
        width: 4rem;
        height: 4rem;
        object-fit: contain;
        margin: 0 auto 1rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        color: var(--primary);
        font-family: Outfit, system-ui, sans-serif;
      }
      p {
        margin: 0 0 1.25rem;
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: linear-gradient(90deg, #640c0e, #b02e32);
        color: #fff;
        font-weight: 700;
        font-size: 0.8rem;
        padding: 0.75rem 1.25rem;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover { opacity: 0.95; }
      .note {
        margin-top: 1rem;
        font-size: 0.7rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.webp" alt="SFU MSA logo" />
      <h1>You’re offline</h1>
      <p>
        The SFU MSA Project Management System needs a network connection to load projects and tasks.
        Private data is never stored for offline browsing.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
      <p class="note">SFU Muslim Students’ Association</p>
    </main>
  </body>
</html>
