openapi: 3.1.0
info:
  title: MSA Event Management System API
  version: 1.0.0-phase1
  description: |
    Phase 1 foundation API for the MSA Event Management System.

    Authentication is the platform's existing Sanctum flow
    (`POST /api/v1/auth/login`). There are no EMS login or logout endpoints.
    Every route below requires a bearer token and is rate-limited by `ems_api`.
  contact:
    name: SFU MSA Platform
servers:
  - url: http://localhost:8000/api/v1/ems
    description: Local development
  - url: https://api.sfumsa.ca/api/v1/ems
    description: Production
tags:
  - name: Access
  - name: Dashboard
  - name: Events
  - name: Lifecycle
  - name: Categories
security:
  - sanctumBearer: []
paths:
  /users/me:
    get:
      tags: [Access]
      summary: Current EMS user
      operationId: getEmsMe
      responses:
        '200':
          description: Authenticated user with EMS permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /roles:
    get:
      tags: [Access]
      summary: EMS roles
      operationId: listEmsRoles
      description: Requires `system.view`.
      responses:
        '200':
          description: Role catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions:
    get:
      tags: [Access]
      summary: EMS permissions
      operationId: listEmsPermissions
      description: Requires `system.view`.
      responses:
        '200':
          description: Permission catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /dashboard:
    get:
      tags: [Dashboard]
      summary: EMS dashboard
      operationId: getEmsDashboard
      description: Requires `events.view`. Scoped to the viewer.
      responses:
        '200':
          description: Summary, upcoming events, activity, quick actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events:
    get:
      tags: [Events]
      summary: List events
      operationId: listEvents
      parameters:
        - $ref: '#/components/parameters/search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: category_id
          in: query
          schema:
            type: integer
        - name: organizer_id
          in: query
          schema:
            type: integer
        - name: upcoming
          in: query
          schema:
            type: boolean
        - name: starts_after
          in: query
          schema:
            type: string
            format: date-time
        - name: starts_before
          in: query
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [start_at, name, status, created_at, updated_at]
        - name: sort_direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Events]
      summary: Create event
      operationId: createEvent
      description: Requires `events.create`. New events always start as `draft`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /events/lifecycle:
    get:
      tags: [Lifecycle]
      summary: Publish the event state machine
      operationId: describeLifecycle
      responses:
        '200':
          description: States and transitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'

  /events/{event}:
    parameters:
      - $ref: '#/components/parameters/eventUuid'
    get:
      tags: [Events]
      summary: Show event
      operationId: showEvent
      responses:
        '200':
          description: Event detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Events]
      summary: Update event
      operationId: updateEvent
      description: Requires `events.update`. Status cannot be set here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Events]
      summary: Partially update event
      operationId: patchEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventWrite'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Events]
      summary: Soft-delete event
      operationId: deleteEvent
      description: Requires `events.delete`.
      responses:
        '200':
          description: Event deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{event}/transitions:
    parameters:
      - $ref: '#/components/parameters/eventUuid'
    post:
      tags: [Lifecycle]
      summary: Apply a lifecycle transition
      operationId: transitionEvent
      description: |
        The policy checks the transition's permission; the lifecycle service
        then validates the edge. Illegal transitions return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  $ref: '#/components/schemas/EventTransitionAction'
      responses:
        '200':
          description: Event in its new state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /event-categories:
    get:
      tags: [Categories]
      summary: List categories
      operationId: listCategories
      parameters:
        - name: is_active
          in: query
          schema:
            type: boolean
        - $ref: '#/components/parameters/search'
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    post:
      tags: [Categories]
      summary: Create category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /event-categories/{category}:
    parameters:
      - $ref: '#/components/parameters/categoryUuid'
    get:
      tags: [Categories]
      summary: Show category
      operationId: showCategory
      responses:
        '200':
          description: Category detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Categories]
      summary: Update category
      operationId: updateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Categories]
      summary: Partially update category
      operationId: patchCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
    delete:
      tags: [Categories]
      summary: Delete category
      operationId: deleteCategory
      description: Returns 409 when events still reference the category.
      responses:
        '200':
          description: Category deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    sanctumBearer:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token from POST /api/v1/auth/login

  parameters:
    eventUuid:
      name: event
      in: path
      required: true
      schema:
        type: string
        format: uuid
    categoryUuid:
      name: category
      in: path
      required: true
      schema:
        type: string
        format: uuid
    search:
      name: search
      in: query
      schema:
        type: string

  responses:
    Unauthenticated:
      description: Missing or invalid Sanctum token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Business-rule conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data, meta]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          type: object

    PaginatedEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            meta:
              type: object
              properties:
                pagination:
                  $ref: '#/components/schemas/Pagination'

    ErrorEnvelope:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
        from:
          type: [integer, 'null']
        to:
          type: [integer, 'null']

    EventStatus:
      type: string
      enum:
        - draft
        - published
        - registration_open
        - registration_closed
        - live
        - completed
        - archived

    EventTransitionAction:
      type: string
      enum:
        - publish
        - unpublish
        - open_registration
        - close_registration
        - mark_live
        - complete
        - archive

    EventWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 180
        slug:
          type: [string, 'null']
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        short_description:
          type: [string, 'null']
          maxLength: 500
        description:
          type: [string, 'null']
        category_id:
          type: [integer, 'null']
        organizer_id:
          type: [integer, 'null']
        location:
          type: [string, 'null']
        start_at:
          type: string
          format: date-time
        end_at:
          type: [string, 'null']
          format: date-time
        timezone:
          type: [string, 'null']
        capacity:
          type: [integer, 'null']
          minimum: 1
        is_public:
          type: boolean

    CategoryWrite:
      type: object
      properties:
        name:
          type: string
        slug:
          type: [string, 'null']
        description:
          type: [string, 'null']
        color:
          type: [string, 'null']
          pattern: '^#[0-9A-Fa-f]{6}$'
        is_active:
          type: boolean
        sort_order:
          type: integer
