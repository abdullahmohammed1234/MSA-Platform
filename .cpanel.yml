---
deployment:
  tasks:
    # SFU MSA Platform — cPanel sync only (NOT full CI/CD).
    # After sync, operators MUST run on the backend host (see
    # docs/PRODUCTION_OPERATIONS_CHECKLIST.md and
    # docs/PHASE_12_PRODUCTION_READINESS_IMPLEMENTATION_REPORT.md):
    #   - php artisan migrate --force
    #   - php artisan storage:link (once)
    #   - php artisan config:cache && route:cache && view:cache && event:cache
    #     (or scripts/prepare-production.sh|ps1)
    #   - php artisan msa:production-check
    #   - php artisan queue:restart
    #   - queue:work --queue=ems-payments,ems-notifications,ems-operations,high,default,low
    #   - cron: * * * * * cd /path/to/msa-backend && php artisan schedule:run
    # Never: migrate:fresh / migrate:refresh on production.

    # 1. Sync the Laravel backend to a secure folder outside public_html
    - /bin/mkdir -p /home2/sfums1d5/msa-backend
    - /bin/rsync -avz --exclude='node_modules' --exclude='.git' --exclude='.env*' --exclude='tests' --exclude='*.sqlite*' backend/ /home2/sfums1d5/msa-backend/

    # 2. Deploy pre-built main frontend files directly to public_html (sfumsa.ca)
    - /bin/mkdir -p /home2/sfums1d5/public_html
    - /bin/rsync -avz --exclude='.env*' --exclude='*.map' --exclude='*.bak' frontend/dist/ /home2/sfums1d5/public_html/

    # 3. Deploy pre-built MSA Connect frontend files to connect.sfumsa.ca document root
    - /bin/mkdir -p /home2/sfums1d5/connect.sfumsa.ca
    - /bin/rsync -avz --exclude='.env*' --exclude='*.map' --exclude='*.bak' connect/dist/ /home2/sfums1d5/public_html/connect/
